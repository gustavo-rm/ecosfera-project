name: ai-sim-service

# Gate de PR do serviço Python. Roda o mesmo `make check` do dia a dia, de modo
# que o que passa localmente passa aqui — inclusive o `import-linter`, que é o
# que transforma a regra de ouro da moldura de Engines ("um Engine não importa
# outro") em barreira efetiva, e não em convenção (ADR-ARCH-0001, Spec §8).
#
# Os testes de integração com Postgres/Redis usam Testcontainers. No runner
# `ubuntu-latest` há daemon Docker, então eles RODAM aqui — afirmação observada,
# não deduzida: o run #6 (M4) fechou em `581 passed, 1 xfailed`, sem contagem de
# `skipped`, e todo run desde então repetiu o padrão. Dois deles falharam com
# erros que só um Postgres vivo produz (extensão `vector` ausente; índice real
# ausente), o que é prova POSITIVA de execução, não apenas ausência de pulo.
#
# Mas rodar não é o mesmo que ser exigido. Três camadas, cada uma com um modo de
# falhar (docs/ci-verification-matrix.md):
#
#   1. o passo abaixo reprova ANTES dos testes se a flag estiver desligada ou o
#      daemon ausente — um `ECOSFERA_REQUIRE_POSTGRES` removido por engano deixa
#      de passar despercebido;
#   2. `ECOSFERA_REQUIRE_POSTGRES` transforma "sem Docker" em FALHA por teste,
#      em vez de pulo (M5);
#   3. um hook de sessão REPROVA a suíte se qualquer teste de infraestrutura
#      pular — inclusive por `skipif` artesanal que não use a marca. Até aqui
#      "zero skips" era conferido por um humano somando à mão.

on:
  push:
    branches: [main, develop]
    paths:
      - "services/ai-sim-service/**"
      - ".github/workflows/ai-sim-service.yml"
  pull_request:
    paths:
      - "services/ai-sim-service/**"
      - ".github/workflows/ai-sim-service.yml"

defaults:
  run:
    working-directory: services/ai-sim-service

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    env:
      # No CI, persistência não é opcional: sem Docker o teste FALHA, não pula.
      ECOSFERA_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: services/ai-sim-service/uv.lock
          # Pinado pelo .python-version do serviço. Sem isso o uv escolhe o
          # Python mais novo disponível, e o uv.lock — que é universal — pode
          # resolver um CONJUNTO DIFERENTE de pacotes por marcador de versão.
          # Para um serviço que promete replay bit-a-bit, validar num
          # interpretador que ninguém usa localmente é justamente o que não pode
          # acontecer. Com requires-python >= 3.13 o lock tem uma resolução só,
          # e este pin é o que garante que continue assim.
          python-version-file: services/ai-sim-service/.python-version

      - name: Sincronizar dependências
        run: uv sync --extra sim --extra infra --group dev

      - name: Registrar o ambiente resolvido
        # Torna a deriva de versões visível no log em vez de silenciosa.
        run: |
          uv run python -VV
          uv run python -c "import numpy, mesa; print('numpy', numpy.__version__, '| mesa', mesa.__version__)"

      # Falha ANTES dos testes se o ambiente não puder cumprir a promessa. Sem
      # este passo, um runner sem Docker só se revelaria no meio da suíte, e um
      # `ECOSFERA_REQUIRE_POSTGRES` removido por engano não se revelaria nunca:
      # a árvore ficaria verde atestando uma verificação que não aconteceu.
      - name: Verificar que a persistência é verificável aqui
        run: |
          test "${ECOSFERA_REQUIRE_POSTGRES:-}" = "1" || {
            echo "::error::ECOSFERA_REQUIRE_POSTGRES não está ligada — os testes de"
            echo "::error::persistência pulariam em silêncio e o gate seria decorativo."
            exit 1
          }
          docker info >/dev/null 2>&1 || {
            echo "::error::Sem daemon Docker: Testcontainers não sobe o Postgres."
            exit 1
          }
          echo "Docker disponível e flag ligada — os testes de persistência DEVEM rodar."

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Formatação (ruff format)
        run: uv run ruff format --check src tests

      - name: Tipos (mypy --strict)
        run: uv run mypy

      - name: Fronteiras de importação (import-linter)
        run: uv run lint-imports

      - name: Testes com cobertura
        run: uv run pytest --cov=ecosfera_ai --cov-report=term-missing
