name: ai-sim-service

# Gate de PR do serviço Python. Roda o mesmo `make check` do dia a dia, de modo
# que o que passa localmente passa aqui — inclusive o `import-linter`, que é o
# que transforma a regra de ouro da moldura de Engines ("um Engine não importa
# outro") em barreira efetiva, e não em convenção (ADR-ARCH-0001, Spec §8).
#
# Os testes de integração com Postgres/Redis usam Testcontainers. No runner
# `ubuntu-latest` há daemon Docker, então eles RODAM aqui — afirmação observada,
# não deduzida: o run #6 (M4) fechou em `581 passed, 1 xfailed`, sem contagem de
# `skipped`, e todo run desde então repetiu o padrão. Dois deles falharam com
# erros que só um Postgres vivo produz (extensão `vector` ausente; índice real
# ausente), o que é prova POSITIVA de execução, não apenas ausência de pulo.
#
# Mas rodar não é o mesmo que ser exigido. Três camadas, cada uma com um modo de
# falhar (docs/ci-verification-matrix.md):
#
#   1. o passo abaixo reprova ANTES dos testes se a flag estiver desligada ou o
#      daemon ausente — um `ECOSFERA_REQUIRE_POSTGRES` removido por engano deixa
#      de passar despercebido;
#   2. `ECOSFERA_REQUIRE_POSTGRES` transforma "sem Docker" em FALHA por teste,
#      em vez de pulo (M5);
#   3. um hook de sessão REPROVA a suíte se qualquer teste de infraestrutura
#      pular — inclusive por `skipif` artesanal que não use a marca. Até aqui
#      "zero skips" era conferido por um humano somando à mão.

on:
  push:
    branches: [main, develop]
    paths:
      - "services/ai-sim-service/**"
      - ".github/workflows/ai-sim-service.yml"
  pull_request:
    paths:
      - "services/ai-sim-service/**"
      - ".github/workflows/ai-sim-service.yml"

defaults:
  run:
    working-directory: services/ai-sim-service

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    env:
      # No CI, persistência não é opcional: sem Docker o teste FALHA, não pula.
      ECOSFERA_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: services/ai-sim-service/uv.lock
          # Pinado pelo .python-version do serviço. Sem isso o uv escolhe o
          # Python mais novo disponível, e o uv.lock — que é universal — pode
          # resolver um CONJUNTO DIFERENTE de pacotes por marcador de versão.
          # Para um serviço que promete replay bit-a-bit, validar num
          # interpretador que ninguém usa localmente é justamente o que não pode
          # acontecer. Com requires-python >= 3.13 o lock tem uma resolução só,
          # e este pin é o que garante que continue assim.
          python-version-file: services/ai-sim-service/.python-version

      - name: Sincronizar dependências
        run: uv sync --extra sim --extra infra --group dev

      - name: Registrar o ambiente resolvido
        # Torna a deriva de versões visível no log em vez de silenciosa.
        run: |
          uv run python -VV
          uv run python -c "import numpy, mesa; print('numpy', numpy.__version__, '| mesa', mesa.__version__)"

      # Falha ANTES dos testes se o ambiente não puder cumprir a promessa. Sem
      # este passo, um runner sem Docker só se revelaria no meio da suíte, e um
      # `ECOSFERA_REQUIRE_POSTGRES` removido por engano não se revelaria nunca:
      # a árvore ficaria verde atestando uma verificação que não aconteceu.
      - name: Verificar que a persistência é verificável aqui
        run: |
          test "${ECOSFERA_REQUIRE_POSTGRES:-}" = "1" || {
            echo "::error::ECOSFERA_REQUIRE_POSTGRES não está ligada — os testes de"
            echo "::error::persistência pulariam em silêncio e o gate seria decorativo."
            exit 1
          }
          docker info >/dev/null 2>&1 || {
            echo "::error::Sem daemon Docker: Testcontainers não sobe o Postgres."
            exit 1
          }
          echo "Docker disponível e flag ligada — os testes de persistência DEVEM rodar."

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Formatação (ruff format)
        run: uv run ruff format --check src tests

      - name: Tipos (mypy --strict)
        run: uv run mypy

      - name: Fronteiras de importação (import-linter)
        run: uv run lint-imports

      - name: Testes com cobertura
        run: uv run pytest --cov=ecosfera_ai --cov-report=term-missing

  # ── Portão do embedder semântico (M6.3, pre-flight b) ───────────────────────
  #
  # O M6.2 declarou uma lacuna em voz alta: `SentenceTransformerEmbedder` nunca
  # rodou com pesos de verdade, porque a política de rede do ambiente de
  # desenvolvimento nega `huggingface.co` (403 no CONNECT) e o gate acima
  # sincroniza sem o extra `ai`. Enquanto a lacuna existir, o M6.3 estaria
  # ancorando geração numa recuperação cuja qualidade ninguém mediu.
  #
  # Este job é o mesmo padrão do Postgres: o que não roda na máquina de quem
  # escreve, roda AQUI — e reprova em vez de pular. Fica separado do gate rápido
  # porque baixa ~1 GB de pesos; não fica opcional, porque uma verificação
  # opcional é a que ninguém executa no dia em que ela importa.
  embedder-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: services/ai-sim-service/uv.lock
          python-version-file: services/ai-sim-service/.python-version

      # Os pesos não mudam entre execuções; baixá-los toda vez seria pagar
      # minutos de CI por um arquivo idêntico. A chave inclui o nome do modelo
      # para que trocá-lo invalide o cache em vez de servir o anterior.
      - name: Cache dos pesos do modelo
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-paraphrase-multilingual-mpnet-base-v2-v1

      - name: Sincronizar com o extra `ai`
        run: uv sync --extra sim --extra infra --extra ai --group dev

      # Sondagem de alcance, ANTES do portão pesado. Se a política de egresso do
      # runner negar o host, o log diz isso em uma linha em vez de deixar a causa
      # enterrada num stack trace de httpx trezentas linhas abaixo.
      - name: Sondar alcance dos hosts de modelo
        run: |
          for host in huggingface.co registry.ollama.ai; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://$host/" || echo "000")
            echo "$host -> HTTP $code"
          done

      - name: Validar o embedder real contra o de referência
        run: uv run python scripts/validate_real_embedder.py

  # ── Portão da geração real (M6.3, correção 1) ───────────────────────────────
  #
  # Os testes de geração com modelo roteirizado afirmam que o portão reage a
  # saídas escolhidas a dedo. Nenhum deles responde à pergunta que decide se a
  # camada serve: com este prompt, um LLM de verdade produz texto que PASSA?
  #
  # Se o prompt for ambíguo, se o modelo ignorar a instrução ou se o verificador
  # for estrito demais, o sintoma é recuo em 100% das gerações — e como recuar é
  # comportamento correto, isso passaria como verde em toda suíte roteirizada.
  # `test_at_least_one_real_generation_survives_the_gate` é o que impede a camada
  # de ser custo puro e parecer sucesso.
  #
  # Mesma política do Postgres desde o M5: sem daemon, FALHA — não pula.
  generation-gate:
    runs-on: ubuntu-latest
    env:
      ECOSFERA_REQUIRE_OLLAMA: "1"
      ECOSFERA_OLLAMA_BASE_URL: "http://localhost:11434"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: services/ai-sim-service/uv.lock
          python-version-file: services/ai-sim-service/.python-version

      - name: Sincronizar dependências
        run: uv sync --extra sim --extra infra --group dev

      # `llama3.2:1b` e não um modelo maior: ver ADR 0028. O que se verifica aqui
      # é que a ancoragem funciona ponta a ponta, e isso não melhora com um
      # modelo que leve dez minutos para baixar em todo run de CI.
      # Os pesos do Ollama não mudam entre execuções. Sem cache, o modelo maior
      # da avaliação (~5 GB) seria baixado em todo run só para produzir o mesmo
      # número.
      - name: Cache dos modelos do Ollama
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-llama3.2-1b-llama3.1-8b-v1

      - name: Instalar o Ollama e baixar os modelos
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags >/dev/null && break
            sleep 1
          done
          ollama pull llama3.2:1b
          # O segundo modelo existe para a MEDIÇÃO do M6.4, e não para o portão:
          # o pre-flight perguntou se a avaliação deve usar o modelo pequeno com
          # que o M6.3 provou o pipeline ou um maior, e a resposta honesta é
          # medir os dois. Escolher em silêncio faria o número parecer
          # propriedade do sistema quando é, em parte, do modelo escolhido.
          ollama pull llama3.1:8b

      # Falha ANTES dos testes se o daemon não subiu. Sem este passo a causa real
      # apareceria como seis erros de marca, e não como "o serviço não está de pé".
      - name: Verificar que a geração é verificável aqui
        run: |
          curl -sf "$ECOSFERA_OLLAMA_BASE_URL/api/tags" >/dev/null || {
            echo "::error::O daemon Ollama não respondeu — os testes de geração"
            echo "::error::real falhariam por ausência de serviço, não por defeito."
            exit 1
          }
          ollama list

      - name: Testes de geração contra o modelo real
        run: uv run pytest tests/integration/test_generation_over_ollama.py -v

      # A MEDIÇÃO do M6.4. Não é portão: nenhum limiar é cobrado aqui, porque
      # perseguir um número seria ajustar o sistema à métrica. O que se exige é
      # que o relatório seja PRODUZIDO e fique legível no log, com as ressalvas
      # junto — a forma do piso da cascata e os cinco tipos de evento que seguem
      # sem checagem de invenção.
      - name: Avaliação adversarial (M6.4) — medir e imprimir, sem limiar
        env:
          ECOSFERA_EVAL_MODELS: "llama3.2:1b,llama3.1:8b"
          # n=15 por célula (2 cenários x 2 modelos = 60 gerações). O turno de
          # encerramento subiu de 3, porque n=3 não distingue "robusto" de
          # "pouco amostrado" — uma taxa de 100% sobre 12 gerações é compatível
          # com uma taxa real de falha bem alta. Quinze por célula não torna a
          # medida definitiva, e torna a diferença entre modelos observável.
          ECOSFERA_EVAL_SAMPLES: "15"
        run: uv run python scripts/evaluate_m6_4.py

      - name: Guardar o registro de tentativas
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generation-attempts
          path: services/ai-sim-service/var/generation_attempts.jsonl
          if-no-files-found: warn
