# Regras causais do MVP (Dossiê §2.1). Dados versionados, não código.
# same_direction: true  => causa↑ implica efeito↑
# same_direction: false => causa↑ implica efeito↓
#
# version 1 -> 2: entram as regras dos subsistemas physics/geology/ocean, para
#   que os novos acoplamentos também sejam narráveis ao aluno (RF-033/039).
# version 2 -> 3: entram as regras da camada EMERGENTE (Inc 3), ligando pressão
#   ambiental a extinção/prosperidade. Continuam sendo REGRAS determinísticas —
#   nenhum LLM participa; o tutor LLM+RAG só entra no Inc 6 (ADR 0002).
version: 3
rules:
  - id: R-CO2-TEMP
    cause: co2
    effect: temperature
    same_direction: true
    template: "Quando o {cause} aumenta, o planeta segura mais calor e a {effect} sobe."
  - id: R-TEMP-ICE
    cause: temperature
    effect: ice_cover
    same_direction: false
    template: "Com a {cause} mais alta, o gelo derrete e a cobertura de gelo ({effect}) diminui."
  - id: R-ICE-ALBEDO
    cause: ice_cover
    effect: albedo
    same_direction: true
    template: "Menos gelo ({cause}) reflete menos luz do Sol, então o {effect} cai."
  - id: R-TEMP-WATER
    cause: temperature
    effect: evaporation
    same_direction: true
    template: "A {cause} maior faz a água evaporar mais rápido ({effect} sobe)."
  - id: R-EVAP-RAIN
    cause: evaporation
    effect: rainfall
    same_direction: true
    template: "Mais {cause} carrega água para o céu e aumenta a chuva ({effect})."
  # --- Subsistemas estendidos (física, geologia e oceano) ---
  - id: R-VOLC-CO2
    cause: volcanism
    effect: co2
    same_direction: true
    template: "Mais vulcões em atividade ({cause}) lançam gases e o {effect} do ar sobe."
  - id: R-SOLAR-TEMP
    cause: solar_flux
    effect: temperature
    same_direction: true
    template: "Quando o planeta recebe mais luz da estrela ({cause}), a {effect} sobe."
  - id: R-TEMP-CURRENTS
    cause: temperature
    effect: ocean_circulation
    same_direction: false
    template: "Com a {cause} mais alta, o mar se mistura menos e as correntes ({effect}) enfraquecem."
  - id: R-RELIEF-EROSION
    cause: relief
    effect: erosion
    same_direction: true
    template: "Montanhas mais altas ({cause}) são desgastadas mais rápido pela chuva ({effect})."
  # --- Camada emergente (Inc 3): pressão ambiental -> biologia ---
  # A temperatura é a pressão seletiva mais legível para o aluno: quando ela sai
  # da tolerância da espécie, a extinção deixa de ser azar e vira consequência.
  - id: R-TEMP-EXTINCTION
    cause: temperature
    effect: extinction
    same_direction: true
    template: "A {cause} passou do que algumas espécies aguentam e elas foram extintas ({effect})."
  - id: R-EXTINCTION-BIODIVERSITY
    cause: extinction
    effect: biodiversity
    same_direction: false
    template: "Cada {cause} tira um fio da teia da vida, então a {effect} do planeta cai."
  - id: R-WATER-BIODIVERSITY
    cause: water
    effect: biodiversity
    same_direction: true
    template: "Com mais água disponível ({cause}), mais espécies encontram lugar para viver e a {effect} cresce."
  - id: R-BIODIVERSITY-BIOMASS
    cause: biodiversity
    effect: biomass
    same_direction: true
    template: "Mais espécies convivendo ({cause}) aproveitam melhor os recursos e a {effect} total sobe."
