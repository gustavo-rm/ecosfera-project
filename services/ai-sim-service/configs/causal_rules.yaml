# Regras causais do MVP (Dossiê §2.1). Dados versionados, não código.
# same_direction: true  => causa↑ implica efeito↑
# same_direction: false => causa↑ implica efeito↓
#
# version 1 -> 2: entram as regras dos subsistemas physics/geology/ocean, para
#   que os novos acoplamentos também sejam narráveis ao aluno (RF-033/039).
# version 2 -> 3: entram as regras da camada EMERGENTE (Inc 3), ligando pressão
#   ambiental a extinção/prosperidade. Continuam sendo REGRAS determinísticas —
#   nenhum LLM participa; o tutor LLM+RAG só entra no Inc 6 (ADR 0002).
# version 3 -> 4 (M2): entram as regras dos ciclos fechados — água, carbono
#   oceânico, nutrientes e capacidade de suporte. São as setas que o aluno passa
#   a poder observar agora que os ciclos deixaram de estar pela metade
#   (ADR 0012/0013).
# version 4 -> 5 (Fase 0): entram as regras que narram a ESPECIAÇÃO por ancestral
#   comum (BIO-001) e a distinção ADAPTAÇÃO × ESPECIAÇÃO (PED-003). Antes desta
#   versão um evento de especiação virava uma observação que não disparava regra
#   alguma: o aluno via a riqueza mudar e não ouvia nada sobre ancestralidade —
#   e o silêncio, num tema onde a concepção equivocada ("A virou B") é a
#   intuição espontânea, é a própria concepção equivocada sendo confirmada.
#
# TRÊS REGRAS DE LINGUAGEM valem para todo `template` deste arquivo, e o Tutor do
# M6 as herda (BIO-005, PED-003, BIO-001):
#
#   1. NADA de intenção. Mutação é "surgiu uma mutação aleatória"; seleção é "a
#      característica aumentou a sobrevivência porque o ambiente era X". Nunca "a
#      espécie desenvolveu/criou/buscou" coisa alguma.
#   2. ADAPTAÇÃO (a frequência dos traços numa população mudou) não é ESPECIAÇÃO
#      (uma linhagem nova surgiu de um ancestral comum). Descrever uma como a
#      outra reduz evolução a adaptação.
#   3. Nenhuma frase afirma que uma espécie gerou outra. Duas linhagens
#      COMPARTILHAM um ancestral comum que sofreu especiação.
#
# `test_no_teleological_language` e `test_adaptation_vs_speciation_wording`
# guardam as três.
version: 5
rules:
  - id: R-CO2-TEMP
    cause: co2
    effect: temperature
    same_direction: true
    template: "Quando o {cause} aumenta, o planeta segura mais calor e a {effect} sobe."
  - id: R-TEMP-ICE
    cause: temperature
    effect: ice_cover
    same_direction: false
    template: "Com a {cause} mais alta, o gelo derrete e a cobertura de gelo ({effect}) diminui."
  - id: R-ICE-ALBEDO
    cause: ice_cover
    effect: albedo
    same_direction: true
    template: "Menos gelo ({cause}) reflete menos luz do Sol, então o {effect} cai."
  - id: R-TEMP-WATER
    cause: temperature
    effect: evaporation
    same_direction: true
    template: "A {cause} maior faz a água evaporar mais rápido ({effect} sobe)."
  - id: R-EVAP-RAIN
    cause: evaporation
    effect: rainfall
    same_direction: true
    template: "Mais {cause} carrega água para o céu e aumenta a chuva ({effect})."
  # --- Subsistemas estendidos (física, geologia e oceano) ---
  - id: R-VOLC-CO2
    cause: volcanism
    effect: co2
    same_direction: true
    template: "Mais vulcões em atividade ({cause}) lançam gases e o {effect} do ar sobe."
  - id: R-SOLAR-TEMP
    cause: solar_flux
    effect: temperature
    same_direction: true
    template: "Quando o planeta recebe mais luz da estrela ({cause}), a {effect} sobe."
  - id: R-TEMP-CURRENTS
    cause: temperature
    effect: ocean_circulation
    same_direction: false
    template: "Com a {cause} mais alta, o mar se mistura menos e as correntes ({effect}) enfraquecem."
  - id: R-RELIEF-EROSION
    cause: relief
    effect: erosion
    same_direction: true
    template: "Montanhas mais altas ({cause}) são desgastadas mais rápido pela chuva ({effect})."
  # --- Camada emergente (Inc 3): pressão ambiental -> biologia ---
  # A temperatura é a pressão seletiva mais legível para o aluno: quando ela sai
  # da tolerância da espécie, a extinção deixa de ser azar e vira consequência.
  - id: R-TEMP-EXTINCTION
    cause: temperature
    effect: extinction
    same_direction: true
    template: "A {cause} passou do que algumas espécies aguentam e elas foram extintas ({effect})."
  - id: R-EXTINCTION-BIODIVERSITY
    cause: extinction
    effect: biodiversity
    same_direction: false
    template: "Cada {cause} tira um fio da teia da vida, então a {effect} do planeta cai."
  - id: R-WATER-BIODIVERSITY
    cause: water
    effect: biodiversity
    same_direction: true
    template: "Com mais água disponível ({cause}), mais espécies encontram lugar para viver e a {effect} cresce."
  - id: R-BIODIVERSITY-BIOMASS
    cause: biodiversity
    effect: biomass
    same_direction: true
    template: "Mais espécies convivendo ({cause}) aproveitam melhor os recursos e a {effect} total sobe."
  # --- Ciclos fechados (M2): água, química e capacidade de suporte ---
  # A troca ar-oceano é a seta que o aluno mais precisa reconstruir: o oceano
  # some com parte do carbono que o vulcanismo lançou, e é por isso que o
  # aquecimento é mais lento do que o CO2 emitido faria supor.
  - id: R-CO2-OCEAN-CARBON
    cause: co2
    effect: ocean_carbon
    same_direction: true
    template: "Quanto mais {cause} no ar, mais o mar absorve, e o carbono dissolvido ({effect}) sobe."
  - id: R-OCEAN-CARBON-PH
    cause: ocean_carbon
    effect: ph
    same_direction: false
    template: "O {cause} dissolvido deixa a água mais ácida, então o {effect} do oceano cai."
  - id: R-PH-BIODIVERSITY
    cause: ph
    effect: biodiversity
    same_direction: true
    template: "Um oceano ácido demais ({cause} baixo) dissolve conchas e esqueletos, e a {effect} do mar cai."
  - id: R-TEMP-ICE-MELT
    cause: temperature
    effect: water
    same_direction: true
    template: "Com a {cause} mais alta o gelo derrete e devolve {effect} líquida ao oceano."
  - id: R-VOLC-NUTRIENTS
    cause: volcanism
    effect: nutrients
    same_direction: true
    template: "As rochas que o {cause} traz à superfície se desgastam e liberam {effect} para a vida."
  - id: R-NUTRIENTS-CAPACITY
    cause: nutrients
    effect: carrying_capacity
    same_direction: true
    template: "Com mais {cause} disponíveis, o ambiente sustenta mais vida ({effect} sobe)."
  - id: R-WATER-CAPACITY
    cause: water
    effect: carrying_capacity
    same_direction: true
    template: "Mais {cause} líquida aproveitável aumenta quanta vida o planeta comporta ({effect})."
  - id: R-CAPACITY-BIOMASS
    cause: carrying_capacity
    effect: biomass
    same_direction: true
    template: "A vida cresce até o limite que o ambiente oferece: se a {effect} pode subir, é porque a {cause} subiu."
  - id: R-BIOMASS-CO2
    cause: biomass
    effect: co2
    same_direction: false
    template: "A {cause} retira carbono do ar para crescer, então o {effect} da atmosfera cai."
  # --- Biologia emergente (M3, ADR 0016) ---
  # As regras abaixo narram a SELEÇÃO LOCAL: a comunidade responde ao ambiente
  # que encontra. Nenhuma delas fala em "melhor adaptado" ou em progresso — a
  # linguagem teleológica é justamente o que a plataforma existe para desfazer.
  - id: R-TEMPERATURE-BIOMASS
    cause: temperature
    effect: biomass
    same_direction: false
    template: "A {cause} se afastou do que a comunidade tolera, e parte dela não se sustentou: a {effect} caiu."
  - id: R-BIOMASS-RICHNESS
    cause: biomass
    effect: species_richness
    same_direction: true
    template: "Com mais {cause} há espaço para linhagens distintas coexistirem, e a {effect} acompanha."
  - id: R-TEMPERATURE-TRAIT
    cause: temperature
    effect: mean_temp_optimum
    same_direction: true
    template: "As coortes que toleram a nova {cause} deixaram mais descendentes, e o {effect} da comunidade seguiu junto."
  # --- Ancestral comum e a distinção adaptação × especiação (Fase 0) ---------
  # A especiação era observável (a riqueza mudava) e INARRÁVEL: nenhuma regra
  # partia de `species_richness`, então a cadeia morria ali. É a lacuna que o
  # BIO-001 fecha, porque o que o aluno não ouve ele preenche com a intuição
  # espontânea — e a intuição espontânea é justamente "a espécie A virou a B".
  - id: R-SPECIATION-COMMON-ANCESTOR
    cause: species_richness
    effect: common_ancestry
    same_direction: true
    template: "Uma população ancestral se dividiu em duas linhagens, e por isso a {cause} mudou: as duas compartilham um ancestral comum ({effect}) e seguem caminhos separados a partir dele — são irmãs, e nenhuma das duas é a versão antiga da outra."
  # A distinção que impede reduzir evolução a adaptação (PED-003): mudar a
  # frequência dos traços numa população é ADAPTAÇÃO, e continua havendo UMA
  # linhagem. Só há ESPECIAÇÃO quando a população se divide.
  - id: R-TRAIT-ADAPTATION
    cause: mean_temp_optimum
    effect: adaptation
    same_direction: true
    template: "O {cause} da população se deslocou ao longo do tempo: isso é adaptação ({effect}), a frequência dos traços mudando dentro de uma linhagem que continua sendo uma só — não é o surgimento de uma linhagem nova."
  # A ordem correta, e a que o aluno inverte sozinho: a variação vem ANTES e sem
  # propósito; o ambiente decide DEPOIS (BIO-005).
  - id: R-ADAPTATION-RANDOM-VARIATION
    cause: adaptation
    effect: variation
    same_direction: true
    template: "A mudança começou por acaso: surgiu uma mutação aleatória ({effect}) que ninguém escolheu, e ela ficou mais comum porque aumentou a sobrevivência no ambiente daquele momento — a {cause} é o resultado disso, não o objetivo."
  # --- Extinção CATASTRÓFICA (Q8, ADR 0019) ---
  # A regra que impede o Tutor de culpar a espécie pela própria morte.
  #
  # `catastrophic_loss` é variável PRÓPRIA justamente para não cair nas regras de
  # adaptação acima. A frase não menciona tolerância, aptidão nem recurso: um
  # evento extremo não seleciona, ele elimina.
  - id: R-CATASTROPHE-EXTINCTION
    cause: catastrophic_loss
    effect: biodiversity
    same_direction: true
    template: "Um evento extremo eliminou a espécie, por mais bem adaptada que ela fosse: a {effect} caiu de uma vez, e não por falha dela."
  - id: R-CATASTROPHE-BIOMASS
    cause: catastrophic_loss
    effect: biomass
    same_direction: true
    template: "A perda foi causada pelo evento, não pelo ambiente do dia a dia: a {effect} despencou de repente."
