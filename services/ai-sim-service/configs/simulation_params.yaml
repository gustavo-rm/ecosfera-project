# Parâmetros do núcleo de simulação determinístico. Dados versionados, não
# código: revisáveis por especialistas sem redeploy (ADR 0001/0003/0004).
#
# version 1 -> 2: entram os subsistemas physics/geology/ocean, a progressão de
#   eras (timeline) e as faixas físicas das novas variáveis de estado.
# version 2 -> 3: entra a camada EMERGENTE (Inc 3) — aptidão ambiental, evolução
#   (AG/DEAP) e ecologia (ABM/Mesa). Estes parâmetros NÃO afetam a camada
#   determinística: a biologia lê o estado e a capacidade de suporte, mas nunca
#   escreve no PlanetState (ADR 0006).
# version 3 -> 4 (M2): SAEM daqui os blocos physics/chemistry/climate/geology/
#   ocean/life. A ciência de cada domínio passou a viver no `params.yaml`
#   versionado do Engine que a executa, co-locado com o código que a consome
#   (Spec §5.1). Ficou aqui só o que NÃO pertence a um Engine: condições
#   iniciais, faixas físicas, progressão de eras, orçamento da moldura e os
#   parâmetros da camada emergente — que não é um Engine (ADR 0014).
#
#   Onde procurar o que saiu:
#     physics    -> src/ecosfera_ai/engines/astronomy/params.yaml
#     geology    -> src/ecosfera_ai/engines/geology/params.yaml
#     climate    -> src/ecosfera_ai/engines/climate/params.yaml
#     chemistry  -> engines/chemistry/ (carbono/N/P/S) + engines/hydrology/ (água)
#     ocean      -> src/ecosfera_ai/engines/hydrology/params.yaml
#     life       -> engines/resource/ (capacidade) + engines/biota/ (crescimento)
version: 4

# Progressão de eras (Dossiê §9): quantos ticks fecham uma era e geram um
# checkpoint append-only.
timeline:
  era_length: 10

# Condições iniciais do planeta (RF-011/012). O estado ORBITAL não vem daqui: é
# derivado dos parâmetros do Astronomy Engine (órbita circular no raio
# configurado), para que o estado de partida não possa ser incoerente com a
# gravidade que o integrador de fato usa.
#
# `water` e `ice_cover` são os AGREGADOS de partida; a ponte os reparte nos
# quatro reservatórios da hidrologia no primeiro tick (ADR 0012).
initial_state:
  temperature: 14.0        # °C, temperatura média global de partida
  co2: 280.0               # ppm, nível de referência pré-industrial
  water: 1.0               # estoque relativo de água líquida
  ice_cover: 0.10          # fração [0,1] coberta por gelo
  biomass: 0.0             # planeta ainda sem vida
  energy: 0.0              # energia absorvida (diagnóstico, estabiliza no 1º tick)
  relief: 0.20             # relevo médio inicial [0,1]
  volcanism: 1.0           # atividade vulcânica na linha de base
  salinity: 0.35           # salinidade média inicial
  ocean_circulation: 0.50  # circulação termohalina inicial [0,1]
  # Carbono dissolvido no oceano, EM EQUILÍBRIO com a atmosfera de referência.
  # Não é um detalhe: o oceano é um reservatório grande, e começá-lo vazio faria
  # o planeta gastar a primeira era enchendo-o às custas do ar — um transiente de
  # condição inicial errada, que se leria como "o oceano resfria o planeta".
  # O valor casa com `reference_ocean_carbon` do Chemistry Engine, que é por
  # definição o carbono oceânico cuja pressão parcial iguala os 280 ppm do ar.
  ocean_carbon: 300.0
  # Estoques de nutriente de partida, nos valores em que o elemento é
  # exatamente NÃO-limitante (a demanda de referência do Resource Engine).
  # Mesma razão do carbono oceânico: zerá-los não é "planeta jovem", é campo não
  # preenchido — e faria a capacidade de suporte nascer em ~0, adiando a
  # abiogênese por dezenas de ticks por artefato de condição inicial.
  # Com estes valores a capacidade inicial reproduz a do subsistema `life`.
  nutrients: 0.30
  nitrogen: 0.50
  phosphorus: 0.10
  sulfur: 0.20

# Faixas físicas válidas (garantem sanidade científica — RF-014).
bounds:
  ice_cover: [0.0, 1.0]
  relief: [0.0, 1.0]
  ocean_circulation: [0.0, 1.0]
  water_min: 0.0
  co2_min: 0.0
  biomass_min: 0.0
  energy_min: 0.0
  solar_flux_min: 0.0
  volcanism_min: 0.0
  salinity_min: 0.0

# ─────────────────────────────────────────────────────────────────────────────
# CAMADA EMERGENTE (Inc 3) — evolução e ecologia.
# Fronteira determinístico × IA (Dossiê §8): estes parâmetros governam apenas o
# que EMERGE (espécies, populações). A física/química/clima/geologia continuam
# bit-a-bit reproduzíveis com a biologia ligada ou desligada.
# ─────────────────────────────────────────────────────────────────────────────

# Aptidão ambiental: traduz o estado determinístico em pressão seletiva.
fitness:
  metabolism_cost: 0.40    # penalidade por unidade de metabolismo
  size_cost: 0.05          # penalidade por corpo grande
  energy_reference: 0.80   # irradiância de referência para produtores
  crowding_weight: 0.50    # peso da competição ao lotar a capacidade

# Evolução (AG com DEAP). Os tetos contêm o custo por era (RSK Inc 3).
evolution:
  population_size: 24         # indivíduos por geração
  generations: 6              # gerações por era
  mutation_rate: 0.20         # probabilidade de mutação por traço
  mutation_sigma: 0.60        # desvio-padrão da mutação gaussiana
  crossover_rate: 0.50        # probabilidade de cruzamento por par
  tournament_size: 3          # pressão seletiva do torneio
  speciation_threshold: 0.12  # distância genética que caracteriza espécie nova
  extinction_fitness: 0.02    # aptidão mínima para a espécie se sustentar
  extinction_population: 0.01 # população mínima viável
  max_species: 12             # teto de espécies vivas simultâneas
  founder_population: 1.0     # população inicial de uma espécie nova

# Ecologia (ABM com Mesa). Predador-presa EMERGE das regras locais.
ecology:
  steps: 12                    # passos ecológicos por era
  growth_rate: 0.35            # crescimento intrínseco dos produtores
  predation_rate: 0.015        # eficiência de captura por unidade de predador
  conversion_efficiency: 0.30  # fração da presa convertida em predador
  mortality_rate: 0.12         # mortalidade natural dos consumidores
  demographic_noise: 0.01      # ruído demográfico (semeado)
  min_viable_population: 0.001 # abaixo disto a população colapsa
  max_agents: 24               # teto de populações simuladas (custo)
  max_steps: 50                # teto absoluto de passos por era (custo)

# ─────────────────────────────────────────────────────────────────────────────
# MOLDURA DE ENGINES (M0) — orçamento por tick (Spec §6, ADR-ARCH-0002).
# Estourar um teto emite um DiagnosticEvent no Canal B e NÃO altera o resultado
# da simulação: reagir ao tempo de execução faria a trajetória depender da carga
# da máquina, e o replay bit-a-bit morreria com isso.
# ─────────────────────────────────────────────────────────────────────────────
engines:
  budget:
    max_duration_s: 0.25   # teto de tempo de um tick de um Engine
    max_events: 500        # teto de domain events por Engine por tick
    max_entities: 50000    # teto de células/coortes processadas por tick
