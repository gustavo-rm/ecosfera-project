# Parâmetros do núcleo de simulação determinístico. Dados versionados, não
# código: revisáveis por especialistas sem redeploy (ADR 0001/0003/0004).
#
# version 1 -> 2: entram os subsistemas physics/geology/ocean, a progressão de
#   eras (timeline) e as faixas físicas das novas variáveis de estado.
version: 2

# Progressão de eras (Dossiê §9): quantos ticks fecham uma era e geram um
# checkpoint append-only.
timeline:
  era_length: 10

# Condições iniciais do planeta (RF-011/012). O estado ORBITAL não vem daqui:
# é derivado dos parâmetros de física (órbita circular no raio configurado).
initial_state:
  temperature: 14.0        # °C, temperatura média global de partida
  co2: 280.0               # ppm, nível de referência pré-industrial
  water: 1.0               # estoque relativo de água líquida
  ice_cover: 0.10          # fração [0,1] coberta por gelo
  biomass: 0.0             # planeta ainda sem vida
  energy: 0.0              # energia absorvida (diagnóstico, estabiliza no 1º tick)
  relief: 0.20             # relevo médio inicial [0,1]
  volcanism: 1.0           # atividade vulcânica na linha de base
  salinity: 0.35           # salinidade média inicial
  ocean_circulation: 0.50  # circulação termohalina inicial [0,1]

# Faixas físicas válidas (garantem sanidade científica — RF-014).
bounds:
  ice_cover: [0.0, 1.0]
  relief: [0.0, 1.0]
  ocean_circulation: [0.0, 1.0]
  water_min: 0.0
  co2_min: 0.0
  biomass_min: 0.0
  energy_min: 0.0
  solar_flux_min: 0.0
  volcanism_min: 0.0
  salinity_min: 0.0

# Física: órbita por velocity Verlet (integrador simplético) e radiação incidente.
# Unidades internas normalizadas: com GM = 1 e raio = 1, o período orbital é 2*pi,
# então dt = 0.05 dá ~126 ticks por volta completa.
physics:
  gravitational_parameter: 1.0  # GM da estrela (UA³/tick²)
  timestep: 0.05                # dt de integração por tick
  luminosity: 1.0               # irradiância a 1 UA (normalizada)
  orbital_radius: 1.0           # raio inicial da órbita (UA)
  eccentricity_kick: 0.0        # 0 = órbita circular; >0 gera elipse

# Química: ciclos de carbono e água (estoques e fluxos).
chemistry:
  outgassing: 1.5             # fonte base de CO2 por desgaseificação
  volcanism_sensitivity: 0.5  # quanto o vulcanismo amplifica a desgaseificação
  carbon_uptake_coeff: 0.02   # absorção de CO2 pela biomassa (fotossíntese)
  weathering_coeff: 0.002     # remoção de CO2 por intemperismo (~ ao estoque)
  melt_coeff: 0.01            # taxa de degelo por °C acima do limiar
  freeze_coeff: 0.008         # taxa de congelamento por °C abaixo do limiar
  melt_threshold: 0.0         # °C acima do qual o gelo derrete
  freeze_threshold: 0.0       # °C abaixo do qual a água congela
  water_ice_exchange: 0.5     # conversão entre variação de gelo e de água

# Clima: balanço de energia + efeito estufa (energy balance model).
climate:
  insolation: 1.0           # insolação de referência (usada sem a física ativa)
  base_albedo: 0.30         # refletividade base (sem gelo)
  ice_albedo_coeff: 0.40    # o gelo aumenta o albedo (reflete mais luz)
  greenhouse_coeff: 0.01    # forçamento radiativo por unidade de CO2
  energy_to_temp: 30.0      # conversão de energia absorvida em °C de equilíbrio
  equilibrium_offset: -5.0  # deslocamento base da temperatura de equilíbrio
  thermal_inertia: 0.25     # fração do desvio corrigida por tick (0..1)
  weather_variability: 0.05 # desvio-padrão do ruído meteorológico (°C)

# Geologia: tectônica, vulcanismo e erosão -> relevo. O vulcanismo alimenta a
# desgaseificação da química no tick seguinte (defasagem documentada).
geology:
  tectonic_activity: 0.05    # intensidade dos pulsos tectônicos (ruído semeado)
  volcanism_baseline: 1.0    # nível de vulcanismo de repouso
  volcanism_decay: 0.10      # relaxação do vulcanismo para a linha de base
  uplift_coeff: 0.004        # soerguimento do relevo por unidade de vulcanismo
  erosion_coeff: 0.010       # desgaste do relevo por unidade de água

# Oceano: ciclo da água fechado, salinidade como concentração e circulação
# termohalina (que sequestra calor da superfície).
ocean:
  salt_content: 0.35             # massa de sal conservada
  salinity_relaxation: 0.20      # velocidade de reequilíbrio da salinidade
  reference_salinity: 0.35       # salinidade de referência da circulação
  reference_temperature: 14.0    # °C de referência da circulação
  salinity_sensitivity: 0.50     # quanto o sal fortalece a circulação
  temperature_sensitivity: 0.02  # quanto o calor enfraquece a circulação
  tidal_forcing: 0.05            # mistura mecânica das marés (luas)
  circulation_baseline: 0.50     # circulação de repouso
  circulation_relaxation: 0.15   # velocidade de reequilíbrio da circulação
  circulation_variability: 0.005 # desvio-padrão do ruído de mistura
  heat_uptake: 0.02              # calor retirado da superfície pela circulação

# Vida: surgimento (abiogênese) e crescimento logístico. SEM AG/ABM (Inc 3/4).
life:
  optimal_temperature: 22.0   # °C ótimo para a vida
  temperature_tolerance: 15.0 # largura da janela térmica habitável
  water_requirement: 0.2      # água mínima para habitabilidade plena
  abiogenesis_threshold: 0.35 # habitabilidade mínima para a vida surgir
  emergence_amount: 0.001     # biomassa semeada na abiogênese
  carrying_capacity: 100.0    # capacidade de suporte com habitabilidade plena
  growth_rate: 0.15           # taxa intrínseca de crescimento logístico
  growth_variability: 0.02    # desvio-padrão do ruído de crescimento
