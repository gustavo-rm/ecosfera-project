[project]
name = "ecosfera-ai-sim-service"
version = "0.1.0"
description = "ECOSFERA — serviço de simulação científica e IA (fronteira determinístico × IA)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
    "httpx>=0.27",
    # Núcleo de simulação determinístico (Inc 2): RNG semeado e álgebra vetorial (RF-023).
    "numpy>=1.26",
]

[project.optional-dependencies]
# Ativado no Inc 3/4 (simulação emergente: AG com DEAP, ABM com Mesa)
sim = ["scipy>=1.13", "deap>=1.4", "mesa>=2.3"]
# Ativado no Inc 6 (tutor LLM+RAG)
ai = ["sentence-transformers>=3.0", "pgvector>=0.3", "langgraph>=0.2", "ollama>=0.3"]
# Ativado no Inc 7 (stealth assessment)
assessment = ["pgmpy>=0.1.25", "scikit-learn>=1.5"]
# Ativado no Inc 0/1 (persistência/mensageria reais)
infra = [
    "motor>=3.4",
    "redis>=5.0",
    "arq>=0.26",
    # Persistência real do núcleo determinístico (Inc 2+): SQLAlchemy async + Alembic.
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
]
mlops = ["mlflow>=2.14"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    # Postgres efêmero para os testes de integração da persistência real.
    "testcontainers[postgres]>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecosfera_ai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Depends(...) como default de parâmetro é idioma do FastAPI, não bug real.
"src/ecosfera_ai/interfaces/http/**" = ["B008"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["ecosfera_ai"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
