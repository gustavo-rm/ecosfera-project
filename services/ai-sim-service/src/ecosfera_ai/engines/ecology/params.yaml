# Ecology Engine — dinâmica trófica emergente (Spec §5.1).
#
# CADÊNCIA (ADR 0016): `steps_per_tick`, e não `steps` por era. Antes o modelo
# rodava um lote de 12 passos no fecho da era; como Engine, ele roda no loop, um
# passo por tick. Com `era_length: 10`, o trabalho total por era é equivalente —
# mas a ecologia passa a ler um ambiente ATUALIZADO entre passos, em vez de um
# instantâneo congelado do início da era. É melhor cientificamente e muda a
# trajetória numérica; como o M3 é o marco que introduz a biota no world-state,
# não há baseline anterior a preservar.
#
# VERSÃO 2 (Fase 1, ECO-001): adiciona o bloco `generalist` — consumidores que
# exploram mais de um nível trófico (onivoria), destravados por progressão de era.
# A versão 1 continua reconstruível: sem o bloco, o carregador assume cadeia
# estrita (o padrão de fábrica mantém a onivoria desligada na era 0).
version: 2

steps_per_tick: 1

# Taxas herdadas do bloco `ecology` de simulation_params.yaml, sem recalibração.
growth_rate: 0.35
predation_rate: 0.015
conversion_efficiency: 0.30
mortality_rate: 0.12
demographic_noise: 0.01
min_viable_population: 0.001

# Repartição inicial da biomassa entre níveis tróficos quando a Ecology recebe
# uma comunidade nova da Evolution. O produtor fica com o restante.
herbivore_share: 0.25
predator_share: 0.05

# A pirâmide de biomassa NÃO inverte (Elton, 1927): cada nível carrega menos que
# o de baixo, porque a conversão dissipa energia. Teto da soma dos consumidores
# como fração do total — sem ele, a renormalização escalaria predadores para cima
# quando os produtores colapsassem, criando um planeta de predadores sem presa.
max_consumer_share: 0.50

# Q11 (validação Tássia): a capacidade de suporte limita TODOS os níveis
# tróficos, não só os produtores. Um ambiente que comporta N de biomassa não
# comporta N de herbívoros ADEMAIS dos produtores — o teto é do ambiente.
#
# Esta é a fração da capacidade ambiental disponível a CADA nível consumidor.
# Ela não reapropria a `carrying_capacity` (que continua sendo do Resource):
# apenas a usa como teto dentro da dinâmica da Ecology, do mesmo modo que o
# produtor já usava. Sem dupla contagem — é o mesmo teto, lido por mais níveis.
# Fração do nível ABAIXO que cada consumidor pode ocupar. Calibrada medindo a
# pirâmide resultante: 0,25 achatava a cadeia em dois níveis (os predadores
# morriam de fome); 0,60 preserva os três e produz uma pirâmide melhor formada
# que a do M3, onde produtores e herbívoros empatavam (56 x 56) — base quase
# plana, que Elton (1927) não admite.
consumer_capacity_share: 0.60

# ECO-001 (Fase 1 — validação Tássia, Div. 3): CONSUMIDORES GENERALISTAS.
#
# A cadeia linear estrita (predador come SÓ o nível imediatamente abaixo)
# empobrece a ecologia: a maioria das espécies reais é generalista. Aqui o
# predador ganha uma DIETA — pesos de preferência sobre mais de um nível de
# presa —, e a onivoria (comer produtor além de herbívoro) abre um segundo
# caminho de propagação: um choque nos produtores alcança o topo por dois
# trajetos, não um só.
#
# PROGRESSÃO POR ERA (PED-001; compromisso da Tássia): cadeias nas eras iniciais,
# poucos onívoros no meio, teias nas eras avançadas. A onivoria não liga de uma
# vez — sua FORÇA cresce da era `unlock_era` (ainda cadeia estrita) à `full_era`
# (dieta plena), em rampa linear. Antes de `unlock_era`, e portanto em TODA a
# era 0, os pesos são (herbívoro=1, produtor=0): o passo trófico reduz EXATAMENTE
# ao do M4, preservando a linha de base e todo predador de nível único.
#
# Destrava no meio do jogo (era 6 = ~tick 60 com era_length 10) e atinge força
# plena na era 12, deixando o grosso do horizonte válido (~500 ticks) sob
# dinâmica de teia sem tocar as primeiras eras, que seguem cadeia.
#
# ┌─ MAGNITUDE CONSERVADORA E DÍVIDA CRUZADA (decisão do arquiteto) ───────────┐
# O peso do produtor é a MAGNITUDE da onivoria (não um liga/desliga), calibrada
# como o M4 calibrou `consumer_capacity_share`: MEDINDO o horizonte longo.
#
# A medição (16 sementes, regime de eras, 500 ticks) mostrou que a onivoria
# AMPLIFICA a dívida de carbono do ADR 0020 — correta na dinâmica, mas empurra a
# amplitude de CO₂ de algumas sementes acima do teto de 60 ppm: a semente 5 vira
# em peso ≥ 0,04 (43→66 ppm) e, no horizonte da dívida (3000 ticks), o
# full-strength colapsa a biosfera da semente 99 onde a cadeia estrita a mantinha
# viva. Isso é uma DÍVIDA CRUZADA: a predação generalista de força plena está
# BLOQUEADA pela correção de carbono de longo prazo (Fase 3, ADR 0020). Ver
# ADR 0030 §"Dependência entre fases".
#
# PESO = 0,02 é o default CONSERVADOR de fábrica: MEDIDO como não-amplificante —
# em 16 sementes a amplitude de CO₂ fica idêntica à da cadeia estrita (nenhuma
# semente nova cruza 60, incluindo a 5 e a 99), com margem abaixo do ponto de
# virada da semente 5 (0,04). O mecanismo existe, é exercido e é versionado; a
# FORÇA fica represada até a Fase 3 pagar a dívida de carbono. É o mesmo padrão
# de capacidade-presente-porém-contida do M1 (framework default-off) e do M3
# (`biology_enabled`). O valor de referência de força plena é 0,30, reproduzido
# como resultado ESPERADO e xfail em `test_long_horizon_stability_not_worsened`.
# └───────────────────────────────────────────────────────────────────────────┘
generalist:
  unlock_era: 6
  full_era: 12
  # Dieta do predador na FORÇA PLENA (após a rampa por era), como pesos de
  # preferência sobre níveis de presa. Somam 1: o generalista REPARTE o esforço
  # de forrageio entre as fontes, não o duplica — sem ganho de captura "de graça"
  # por comer de dois poços. `herbivore` é a presa da cadeia; `producer` é a
  # fonte fora-da-cadeia (onivoria) que a era destrava, e é a MAGNITUDE contida.
  predator_diet:
    herbivore: 0.98
    producer: 0.02

# Limiares de evento.
collapse_threshold: 0.05   # fração da biomassa abaixo da qual o nível colapsa
decline_threshold: 0.20    # queda relativa que caracteriza declínio notável

# Tetos de custo (RSK Inc 3) — contenção, não ciência.
max_agents: 24
max_steps: 50

budget:
  max_duration_s: 0.25
  max_events: 100
