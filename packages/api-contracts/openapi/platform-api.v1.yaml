components:
  schemas:
    Adaptation:
      type: object
      properties:
        difficulty:
          type: string
        unlocks:
          type: array
          items:
            type: string
      required:
        - difficulty
        - unlocks
      additionalProperties: false
    Advice:
      type: object
      properties:
        advice:
          type: string
      required:
        - advice
      additionalProperties: false
    AdvisorRequest:
      type: object
      properties:
        role:
          type: string
          enum:
            - scientist
            - economist
            - ecologist
            - citizen
        query:
          type: string
          minLength: 1
          maxLength: 1000
      required:
        - role
        - query
      additionalProperties: false
    AlertConfig:
      type: object
      properties:
        limiarDeDominio:
          type: number
          minimum: 0
          maximum: 1
        incertezaMaxima:
          type: number
          minimum: 0
          maximum: 1
        minimoDeEvidencias:
          type: integer
          minimum: 0
          maximum: 1000
        diasDeInatividade:
          type: integer
          minimum: 1
          maximum: 365
        situacaoDaRevisao:
          type: string
      required:
        - limiarDeDominio
        - incertezaMaxima
        - minimoDeEvidencias
        - diasDeInatividade
        - situacaoDaRevisao
      additionalProperties: false
    AlertConfigRequest:
      type: object
      properties:
        limiarDeDominio:
          type: number
          minimum: 0
          maximum: 1
        incertezaMaxima:
          type: number
          minimum: 0
          maximum: 1
        minimoDeEvidencias:
          type: integer
          minimum: 0
          maximum: 1000
        diasDeInatividade:
          type: integer
          minimum: 1
          maximum: 365
      required:
        - limiarDeDominio
        - incertezaMaxima
        - minimoDeEvidencias
        - diasDeInatividade
      additionalProperties: false
    Assessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12})$
        kind:
          type: string
        score:
          type:
            - number
            - "null"
        competencyCode:
          type:
            - string
            - "null"
        missionId:
          anyOf:
            - type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12})$
            - type: "null"
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
      required:
        - id
        - kind
        - score
        - competencyCode
        - missionId
        - createdAt
      additionalProperties: false
    AssessmentEventEnvelope:
      type: object
      properties:
        eventId:
          type: string
          minLength: 8
          maxLength: 100
        type:
          type: string
          enum:
            - EvidenciaGerada
            - CompetenciaAtualizada
            - RubricaAvaliada
        version:
          default: 1
          type: number
          const: 1
        occurredAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
        traceId:
          type: string
          maxLength: 64
        producer:
          type: string
          maxLength: 64
        data:
          type: object
          propertyNames:
            type: string
          additionalProperties: {}
      required:
        - eventId
        - type
        - occurredAt
        - data
    AssessmentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Assessment"
      required:
        - items
      additionalProperties: false
    BnccMastery:
      type: object
      properties:
        studentId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12})$
        skills:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              theme:
                type:
                  - string
                  - "null"
              component:
                type:
                  - string
                  - "null"
              validationStatus:
                type: string
              competencyCode:
                type: string
              mastery:
                type:
                  - number
                  - "null"
              uncertainty:
                type:
                  - number
                  - "null"
              evidenceCount:
                type: integer
                minimum: -9007199254740991
                maximum: 9007199254740991
            required:
              - code
              - theme
              - component
              - validationStatus
              - competencyCode
              - mastery
              - uncertainty
              - evidenceCount
            additionalProperties: false
      required:
        - studentId
        - skills
      additionalProperties: false
    BnccSkill:
      type: object
      properties:
        code:
          type: string
        description:
          type: string
        component:
          type:
            - string
            - "null"
        theme:
          type:
            - string
            - "null"
        stage:
          type:
            - string
            - "null"
        competencyCode:
          type:
            - string
            - "null"
        validationStatus:
          type: string
          description: pending_validation = aguardando especialista (RSK-06)
        catalogVersion:
          type: string
        active:
          type: boolean
      required:
        - code
        - description
        - component
        - theme
        - stage
        - competencyCode
        - validationStatus
        - catalogVersion
        - active
      additionalProperties: false
    BnccSkillList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BnccSkill"
      required:
        - items
      additionalProperties: false
    ChangeRoleRequest:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/Role"
      required:
        - role
      additionalProperties: false
    Checkpoint:
      type: object
      properties:
        checkpointId:
          type: string
      required:
        - checkpointId
      additionalProperties: false
    Class:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12})$
        schoolId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12})$
        teacherUserId:
          anyOf:
