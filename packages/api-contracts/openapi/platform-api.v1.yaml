# GERADO por services/platform-api (pnpm openapi:gerar). Não edite à mão: mude o contrato no código.
openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: ECOSFERA platform-api
  version: 1.0.0
  description: 'API da plataforma educacional ECOSFERA (identidade, educação, avaliação em modo leitura e gateway de simulação/tutor). Erros em RFC 7807 com traceId. A extensão x-authorization descreve, por operação, papéis, regra de posse e consentimento exigidos. WebSocket: GET /planets/{id}/stream (subprotocolos "ecosfera.v1" e "bearer.<jwt>"), mensagens {type: delta|event|tutor|alert, payload, tickId}.'
  license:
    name: MIT
servers:
  - url: /platform/api/v1
tags:
  - name: ai
  - name: assessment
  - name: auth
  - name: classes
  - name: consent
  - name: curriculum
  - name: dashboard
  - name: federation
  - name: internal
  - name: lgpd
  - name: missions
  - name: operacao
  - name: planets
  - name: research
  - name: schools
  - name: users
paths:
  /admin/lti/platforms:
    post:
      operationId: registerLtiPlatform
      tags:
        - federation
      summary: Registra plataforma LTI da escola
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterLtiPlatformRequest"
      responses:
        "201":
          description: Registrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LtiPlatform"
        "401":
          description: Não autenticado (token ausente, expirado ou revogado)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Sem permissão para esta ação
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Já registrada
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Dados inválidos
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Limite de requisições excedido
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Erro interno (com traceId)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      x-authorization:
        roles:
          - admin
